name: Deploy calculator site to GitHub Pages

# Publishes the static page in `site/` to GitHub Pages. The Cloudflare Worker in
# `cloudflare-worker/` sits in front of it at solvivaenergy.com/calculator and
# enforces the password gate before proxying here.
#
# The previous React build (solar-calc) is retired under `archive/` and is no
# longer deployed. See archive/README.md.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
